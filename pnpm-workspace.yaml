# 公開から7日未満の版を入れない。依存の乗っ取りへの備え。緊急時だけminimumReleaseAgeExcludeにname@versionで1版ずつ足す
minimumReleaseAge: 10080
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  'minimatch@>=10.0.0 <11.0.1': ^11.0.3
# 7日未満の版の例外。1版ずつ書き、7日を過ぎたら消す
minimumReleaseAgeExclude:
  - '@babel/helper-string-parser@7.29.11'
  - '@babel/parser@7.29.11'
  - '@babel/types@7.29.11'
  - postcss@8.5.31
  - tldts-core@7.4.19
  - tldts@7.4.19
  - zustand@5.0.16
